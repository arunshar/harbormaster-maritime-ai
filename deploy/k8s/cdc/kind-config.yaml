# kind cluster for the local CDC plane. Everything runs inside the cluster,
# and the host reaches it through NodePort mappings. Every mapping binds to
# 127.0.0.1, so other hosts on the network cannot reach these ports.
#   30092/30093  Kafka (Strimzi nodeport listener: bootstrap + broker-0)
#   30083        Debezium Kafka Connect REST
#   30432        Postgres 16 (wal_level=logical)
#   30379        Redis
#   30800        DynamoDB Local
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hm-cdc
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30092
        hostPort: 30092
        listenAddress: "127.0.0.1"
      - containerPort: 30093
        hostPort: 30093
        listenAddress: "127.0.0.1"
      - containerPort: 30083
        hostPort: 30083
        listenAddress: "127.0.0.1"
      - containerPort: 30432
        hostPort: 30432
        listenAddress: "127.0.0.1"
      - containerPort: 30379
        hostPort: 30379
        listenAddress: "127.0.0.1"
      - containerPort: 30800
        hostPort: 30800
        listenAddress: "127.0.0.1"
